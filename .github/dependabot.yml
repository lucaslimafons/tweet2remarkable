# Version updates wait out a cooldown that matches pnpm's minimumReleaseAge (14 days), so a
# freshly compromised release never lands automatically. Security updates skip the cooldown and
# the ignore rules below.
#
# Major versions are never proposed: they change the runtime or toolchain (Node 25+ drops corepack,
# TypeScript 7 is a new compiler) and are done deliberately, by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 14
      semver-patch-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on the Node 24 LTS line; move to the next LTS on purpose.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
